<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot 對話介面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        .settings-panel {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .settings-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-item label {
            font-size: 14px;
            color: #555;
        }

        .setting-item input[type="text"],
        .setting-item input[type="number"] {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .setting-item input[type="text"] {
            width: 200px;
        }

        .setting-item input[type="number"] {
            width: 80px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 70px;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #999;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #c33;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .thinking-block {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .thinking-header {
            padding: 8px 12px;
            background: #ffeaa7;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            transition: background 0.2s;
        }

        .thinking-header:hover {
            background: #ffd93d;
        }

        .thinking-header::before {
            content: '🤔';
            font-size: 16px;
        }

        .thinking-header .label {
            font-weight: 600;
            color: #856404;
            flex: 1;
        }

        .thinking-header .toggle {
            color: #856404;
            font-size: 12px;
            transition: transform 0.2s;
        }

        .thinking-header .toggle.expanded {
            transform: rotate(180deg);
        }

        .thinking-content {
            padding: 12px;
            background: #fffbf0;
            color: #856404;
            white-space: pre-wrap;
            line-height: 1.6;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            font-size: 14px;
        }

        .thinking-content.expanded {
            max-height: 500px;
            overflow-y: auto;
        }

        .thinking-content::-webkit-scrollbar {
            width: 6px;
        }

        .thinking-content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .thinking-content::-webkit-scrollbar-thumb {
            background: #ffc107;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            🤖 Chatbot 對話介面
        </div>
        
        <div class="settings-panel">
            <div class="settings-row">
                <div class="setting-item">
                    <label>API URL:</label>
                    <input type="text" id="apiUrl" value="http://localhost:8001/v1/chat/completions">
                </div>
                <div class="setting-item">
                    <label>Temperature:</label>
                    <input type="number" id="temperature" value="0.6" min="0" max="2" step="0.1">
                </div>
                <div class="setting-item">
                    <label>Max Tokens:</label>
                    <input type="number" id="maxTokens" value="1024" min="1" max="4096">
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-content">
                    你好!我是 Chatbot-A-large,有什麼可以幫助你的嗎?
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="輸入訊息..."
                    autocomplete="off"
                >
                <button id="sendButton">發送</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const apiUrlInput = document.getElementById('apiUrl');
        const temperatureInput = document.getElementById('temperature');
        const maxTokensInput = document.getElementById('maxTokens');

        let conversationHistory = [];
        let isProcessing = false;

        // 解析思考標籤
        function parseThinkingTags(text) {
            // 處理 \n 換行符號,將其轉換為真正的換行
            text = text.replace(/\\n/g, '\n');
            
            const parts = [];
            
            // 情況1: 標準格式 <think>...</think>
            const standardRegex = /<think>\s*([\s\S]*?)\s*<\/think>/g;
            let hasStandardThink = standardRegex.test(text);
            standardRegex.lastIndex = 0; // 重置 regex
            
            if (hasStandardThink) {
                // 有完整的 <think> 標籤
                let lastIndex = 0;
                let match;
                
                while ((match = standardRegex.exec(text)) !== null) {
                    // 添加思考標籤前的文本
                    if (match.index > lastIndex) {
                        const beforeText = text.slice(lastIndex, match.index).trim();
                        if (beforeText) {
                            parts.push({
                                type: 'text',
                                content: beforeText
                            });
                        }
                    }
                    
                    // 添加思考內容
                    const thinkingContent = match[1].trim();
                    if (thinkingContent) {
                        parts.push({
                            type: 'thinking',
                            content: thinkingContent
                        });
                    }
                    
                    lastIndex = match.index + match[0].length;
                }
                
                // 添加剩餘文本
                if (lastIndex < text.length) {
                    const remainingText = text.slice(lastIndex).trim();
                    if (remainingText) {
                        parts.push({
                            type: 'text',
                            content: remainingText
                        });
                    }
                }
            } else {
                // 情況2: 只有 </think> 結尾標籤 (開頭被省略)
                const endThinkIndex = text.indexOf('</think>');
                
                if (endThinkIndex !== -1) {
                    // 找到 </think>,將之前的內容視為思考
                    const thinkingContent = text.slice(0, endThinkIndex).trim();
                    const afterContent = text.slice(endThinkIndex + 8).trim(); // 8 = '</think>'.length
                    
                    if (thinkingContent) {
                        parts.push({
                            type: 'thinking',
                            content: thinkingContent
                        });
                    }
                    
                    if (afterContent) {
                        parts.push({
                            type: 'text',
                            content: afterContent
                        });
                    }
                } else {
                    // 沒有任何 think 標籤,直接返回文本
                    if (text.trim()) {
                        parts.push({
                            type: 'text',
                            content: text
                        });
                    }
                }
            }

            return parts;
        }

        // 創建思考區塊
        function createThinkingBlock(content) {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking-block';
            
            const header = document.createElement('div');
            header.className = 'thinking-header';
            header.innerHTML = `
                <span class="label">思考中...</span>
                <span class="toggle">▼</span>
            `;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'thinking-content';
            contentDiv.textContent = content;
            
            header.addEventListener('click', () => {
                const isExpanded = contentDiv.classList.toggle('expanded');
                const toggle = header.querySelector('.toggle');
                toggle.classList.toggle('expanded', isExpanded);
            });
            
            thinkingDiv.appendChild(header);
            thinkingDiv.appendChild(contentDiv);
            
            return thinkingDiv;
        }

        // 添加訊息到對話區
        function addMessage(role, content, isStreaming = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (role === 'assistant' && !isStreaming) {
                // 解析思考標籤
                const parts = parseThinkingTags(content);
                
                if (parts.length > 0 && parts.some(p => p.type === 'thinking')) {
                    // 有思考標籤，需要特殊處理
                    parts.forEach(part => {
                        if (part.type === 'thinking') {
                            contentDiv.appendChild(createThinkingBlock(part.content));
                        } else if (part.content.trim()) {
                            const textSpan = document.createElement('span');
                            textSpan.textContent = part.content;
                            contentDiv.appendChild(textSpan);
                        }
                    });
                } else {
                    contentDiv.textContent = content;
                }
            } else {
                contentDiv.textContent = content;
            }
            
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            return contentDiv;
        }

        // 顯示錯誤訊息
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = `錯誤: ${message}`;
            chatMessages.appendChild(errorDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 顯示/隱藏輸入指示器
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message assistant';
            indicator.id = 'typingIndicator';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator active';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            
            indicator.appendChild(typingDiv);
            chatMessages.appendChild(indicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 發送訊息
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isProcessing) return;

            isProcessing = true;
            sendButton.disabled = true;
            userInput.disabled = true;

            // 添加用戶訊息
            addMessage('user', message);
            conversationHistory.push({
                role: 'user',
                content: message
            });

            userInput.value = '';

            // 顯示輸入指示器
            showTypingIndicator();

            try {
                const apiUrl = apiUrlInput.value;
                const temperature = parseFloat(temperatureInput.value);
                const maxTokens = parseInt(maxTokensInput.value);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': '*/*'
                    },
                    body: JSON.stringify({
                        model: 'Qwen/Qwen3-4B-Thinking-2507',
                        messages: conversationHistory,
                        temperature: temperature,
                        max_tokens: maxTokens,
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 請求失敗: ${response.status} ${response.statusText}`);
                }

                hideTypingIndicator();

                // 創建助手訊息容器（串流模式）
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message assistant';
                
                const assistantContentDiv = document.createElement('div');
                assistantContentDiv.className = 'message-content';
                assistantContentDiv.textContent = '';
                
                messageDiv.appendChild(assistantContentDiv);
                chatMessages.appendChild(messageDiv);
                
                let fullResponse = '';

                // 處理串流回應
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6).trim();
                            
                            if (data === '[DONE]') continue;
                            
                            try {
                                const json = JSON.parse(data);
                                const content = json.choices?.[0]?.delta?.content;
                                
                                if (content) {
                                    fullResponse += content;
                                    assistantContentDiv.textContent = fullResponse;
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch (e) {
                                // 忽略解析錯誤
                            }
                        }
                    }
                }

                // 串流完成後，重新渲染訊息以處理思考標籤
                messageDiv.remove();
                addMessage('assistant', fullResponse, false);

                // 將助手回應添加到對話歷史
                conversationHistory.push({
                    role: 'assistant',
                    content: fullResponse
                });

            } catch (error) {
                hideTypingIndicator();
                showError(error.message);
                console.error('Error:', error);
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        // 事件監聽
        sendButton.addEventListener('click', sendMessage);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 初始焦點
        userInput.focus();
    </script>
</body>
</html>
