# RAG workload configuration
test_duration: 60
target_rps: 6
request_timeout: 1800
seed: 42

tokenizer:
  name: "Qwen/Qwen3-0.6B"
  trust_remote_code: false

models:
  - name: "Chatbot"
    type: "llm"
    endpoint: "http://0.0.0.0:8000/v1/completions"
    input_len: 500
    output_len: 500
    range_ratio: 0
    temperature: 0.7
    stream: true
    ignore_eos: true

  - name: "VisionProcessor"
    type: "vlm"
    endpoint: "http://0.0.0.0:8000/v1/chat/completions"
    input_len: 500
    output_len: 500
    range_ratio: 0
    temperature: 0.7
    stream: true
    ignore_eos: true
    mm_base_items_per_request: 1
    mm_num_mm_items_range_ratio: 0
    mm_bucket_config: "{(256,256,1):0.3,(512,512,1):0.4,(720,1280,1):0.3}"

  - name: "Embedding"
    type: "embedding"
    endpoint: "http://0.0.0.0:8000/v1/embeddings"
    input_len: 500
    output_len: 1
    range_ratio: 0
    encoding_format: "float"

scenarios:
  round_robin:
    enabled: false

  zipfian:
    enabled: false
    weights: [0.4, 0.1, 0.5]

  bursty:
    enabled: false
    burst_interval: 15
    burst_size: 20
    background_rps_ratio: 0.5

  single_model:
    enabled: false

  rag:
    enabled: true
    weights: [40, 10, 50]
