# Single model test configuration
test_duration: 15
target_rps: 2
request_timeout: 2000
seed: 42

tokenizer:
  name: "Qwen/Qwen3-0.6B"
  trust_remote_code: false

# 注意：Single Model scenario 只能有一個模型
models:
  - name: "Chatbot"
    type: "llm"
    endpoint: "http://127.0.0.1:48000/v1/completions"
    input_len: 900
    output_len: 300
    range_ratio: 0.0
    temperature: 0.7
    stream: true
    ignore_eos: true

  # - name: "VisionProcessor"
  #   type: "vlm"
  #   endpoint: "http://127.0.0.1:48000/v1/chat/completions"
  #   input_len: 1200
  #   output_len: 500
  #   temperature: 0.7
  #   stream: true
  #   ignore_eos: true
  #   mm_base_items_per_request: 1
  #   mm_num_mm_items_range_ratio: 0.0
  #   mm_bucket_config: "{(256,256,1):0.5,(720,1280,1):0.5}"

  # - name: "Embedding"
  #   type: "embedding"
  #   endpoint: "http://127.0.0.1:48000/v1/embeddings"
  #   input_len: 1000
  #   output_len: 1
  #   encoding_format: "float"

  # - name: "Reranker"
  #   type: "reranker"
  #   endpoint: "http://127.0.0.1:48000/v1/rerank"
  #   query_len: 200                    # Length of search query
  #   document_len: 1000                # Length of each document chunk
  #   num_documents: 5                  # Number of documents to rerank
  #   top_n: 4        

scenarios:
  round_robin:
    enabled: false

  zipfian:
    enabled: false
    weights: [1.0]

  bursty:
    enabled: false

  single_model:
    enabled: true  # 只測試單一模型

  rag:
    enabled: false
    weights: [100]
