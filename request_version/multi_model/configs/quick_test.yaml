# Quick test configuration
test_duration: 30
target_rps: 2
request_timeout: 2000
seed: 42

tokenizer:
  name: "Qwen/Qwen3-0.6B"
  trust_remote_code: false

models:
  - name: "Chatbot"
    type: "llm"
    endpoint: "http://0.0.0.0:8000/v1/completions"
    input_len: 100
    output_len: 100
    temperature: 0.7
    stream: true
    ignore_eos: true

  - name: "Embedding"
    type: "embedding"
    endpoint: "http://0.0.0.0:8000/v1/embeddings"
    input_len: 100
    output_len: 100
    encoding_format: "float"

scenarios:
  round_robin:
    enabled: true

  zipfian:
    enabled: true
    weights: [0.8, 0.2]

  bursty:
    enabled: false
    burst_interval: 10
    burst_size: 5
    background_rps_ratio: 0.5

  single_model:
    enabled: false

  rag:
    enabled: false
    weights: [50, 50]
