# Single model test configuration - Vision
test_duration: 600
target_rps: 2
request_timeout: 2000
seed: 42

tokenizer:
  name: "Qwen/Qwen3-0.6B"
  trust_remote_code: false

models:
  - name: "VisionProcessor"
    type: "vlm"
    endpoint: "http://127.0.0.1:48000/v1/chat/completions"
    input_len: 1200
    output_len: 500
    temperature: 0.7
    stream: true
    ignore_eos: true
    mm_base_items_per_request: 1
    mm_num_mm_items_range_ratio: 0.0
    mm_bucket_config: "{(256,256,1):0.5,(720,1280,1):0.5}"

scenarios:
  round_robin:
    enabled: false

  zipfian:
    enabled: false
    weights: [1.0]

  bursty:
    enabled: false

  single_model:
    enabled: true

  rag:
    enabled: false
    weights: [100]